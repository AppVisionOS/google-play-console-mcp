[project]
name = "google-play-console-mcp"
version = "1.0.0"
description = "Google Play Console MCP Server – reviews, monetization, vitals, financial reports for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-cloud-storage>=2.16.0",
    "httpx>=0.27.0",
]

[project.scripts]
google-play-console-mcp = "google_play_console_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_play_console_mcp"]
